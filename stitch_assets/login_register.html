<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ZoneDrop - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#404758",
                        "inverse-surface": "#213145",
                        "tertiary-container": "#001f26",
                        "primary-fixed-dim": "#c0c6db",
                        "on-primary": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "on-background": "#0b1c30",
                        "surface-container-low": "#eff4ff",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary": "#0058be",
                        "on-tertiary-container": "#0090a9",
                        "tertiary-fixed-dim": "#4cd7f6",
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "on-secondary-container": "#fefcff",
                        "inverse-primary": "#c0c6db",
                        "primary-fixed": "#dce2f8",
                        "on-tertiary-fixed": "#001f26",
                        "on-surface": "#0b1c30",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#acedff",
                        "on-error-container": "#93000a",
                        "tertiary": "#000000",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary-fixed-variant": "#004395",
                        "on-primary-fixed": "#151b2b",
                        "on-surface-variant": "#45464c",
                        "surface-container-high": "#dce9ff",
                        "surface-bright": "#f8f9ff",
                        "secondary-fixed-dim": "#adc6ff",
                        "background": "#f8f9ff",
                        "primary-container": "#151b2b",
                        "surface": "#f8f9ff",
                        "surface-tint": "#575e70",
                        "secondary-fixed": "#d8e2ff",
                        "on-primary-container": "#7d8497",
                        "on-tertiary": "#ffffff",
                        "outline": "#76777d",
                        "on-tertiary-fixed-variant": "#004e5c",
                        "error": "#ba1a1a",
                        "secondary-container": "#2170e4",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c6c6cd",
                        "error-container": "#ffdad6",
                        "primary": "#000000",
                        "surface-container": "#e5eeff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "stack-sm": "8px",
                        "unit": "4px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Geist"],
                        "mono-data": ["JetBrains Mono"],
                        "headline-md": ["Geist"],
                        "body-sm": ["Geist"],
                        "label-md": ["Geist"],
                        "display-lg": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "body-lg": ["Geist"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Geist', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0; }
        .filled-icon { font-variation-settings: 'FILL' 1 !important; }
        .custom-input:focus { border-color: #2170e4; box-shadow: 0 0 0 2px rgba(33, 112, 228, 0.2); outline: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<main class="flex-grow flex flex-col justify-center items-center px-container-padding py-8 max-w-md mx-auto w-full">
<div class="mb-stack-lg w-full flex justify-center">
<div class="w-24 h-24 rounded-2xl bg-surface-container flex items-center justify-center shadow-sm overflow-hidden">
<img alt="ZoneDrop Main Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoqLJcUItXeHPpDxLgUeVJz4jjslBa4JrT1ib3oxE1YtlQUd6t-YVgEeledrI3urgzDtB0NMAjQYWGtSMSEhtzhGSGanyOfFZmQvHW3ulAnij_zkYz_8ucZg90VKfmP3ENI_sgpA-B-b5g-dSjDSWjFRlHPfoRfAmYwK-Cb3P8VjxYipw81FWt4XanKQYXIaAxA3Mt-m-c3ZsTM9ftYKKhsqzENf5biAe3PLRqjAhWbaJZG66_AkLr6w"/>
</div>
</div>
<div class="w-full text-center mb-stack-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to manage your logistics network.</p>
</div>
<form class="w-full flex flex-col gap-stack-md" onsubmit="event.preventDefault(); document.getElementById('login-btn').innerText = 'Authenticating...'; setTimeout(() =&gt; window.location.reload(), 1500);">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="custom-input w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface text-on-surface font-body-md transition-all duration-200" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="custom-input w-full pl-10 pr-10 py-3 rounded-xl border border-outline-variant bg-surface text-on-surface font-body-md transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="const input = document.getElementById('password'); const icon = this.querySelector('span'); if(input.type === 'password'){input.type = 'text'; icon.innerText = 'visibility_off';} else {input.type = 'password'; icon.innerText = 'visibility';}" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end w-full mt-1">
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="mt-stack-sm w-full bg-secondary-container text-on-secondary-container font-headline-sm text-[16px] py-3 rounded-xl shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" id="login-btn" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="relative flex items-center my-stack-sm w-full">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-md text-label-md text-outline">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full bg-surface border border-outline-variant text-on-surface font-body-md text-body-md py-3 rounded-xl hover:bg-surface-variant active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-stack-md">
                Don't have an account? <a class="text-secondary font-medium hover:underline" href="#">Register</a>
</p>
</form>
</main>
</body></html>
