services:
  - type: web
    name: lastmile-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: lastmile-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_ENABLED
        value: "false"

databases:
  - name: lastmile-db
    databaseName: lastmile
    user: lastmile
    plan: free
    postgresMajorVersion: 16
