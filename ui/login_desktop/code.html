<h1 class="font-headline-lg text-headline-lg font-black text-on-primary-container tracking-tight">ZoneDrop</h1>

<!-- Value Prop / Quote -->

<h2 class="font-display-lg text-display-lg text-on-primary-container mb-stack-md">Precision. <br>Delivered.</h2>
<p class="font-body-lg text-body-lg text-on-primary-container/80">Logistics intelligence engineered for high-performance delivery ecosystems.</p>
</div>
</div>
</section>
<!-- Right Side: Login Form Area -->
<section class="w-full lg:w-1/2 flex items-center justify-center p-container-padding bg-surface">
<div class="w-full max-w-md bg-surface-container-lowest rounded-[16px] shadow-[0px_12px_48px_rgba(11,18,33,0.12)] border border-outline-variant p-8 relative overflow-hidden">

<div class="relative z-10">
<!-- Mobile Logo (hidden on desktop) -->
<div class="flex lg:hidden items-center justify-center gap-2 mb-stack-lg">
<span class="material-symbols-outlined text-[32px] text-secondary">local_shipping</span>
<span class="font-headline-md text-headline-md font-black text-secondary tracking-tight">ZoneDrop</span>
</div>
<div class="text-center mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your credentials to access the logistics dashboard.</p>
</div>
<form action="#" class="space-y-stack-md">
<!-- Email Input -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all" id="email" name="email" placeholder="admin@zonedrop.logistics" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Login Button -->
<button class="w-full py-3 px-4 bg-secondary text-on-secondary font-label-md text-label-md rounded-lg shadow-sm hover:bg-secondary-container focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-all active:scale-[0.98]" type="submit">

                        </button>

<span class="px-4 font-body-sm text-body-sm text-on-surface-variant">or</span>
<div class="border-t border-outline-variant flex-grow"></div>
